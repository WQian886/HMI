# 阶段 A · A6 CI (GitHub Actions windows-2022)
#
# ★ 2026-10-08:这个文件原来在 hmi/.github/workflows/build.yml,GitHub 根本不会执行它。
#   GitHub 只认【仓库根】的 .github/workflows/。所以 A6 这一项标了"✅ 验证通过",
#   实际上从来没跑过一次 —— 本地 64/64 全绿掩盖了"CI 一次都没绿过"。
#   见 docs/现状.md 第七节 CI 一节。
#
# ★ 同一个文件里还修了另外三处(exit 码实测出来的,不是看出来的):
#   ① 源目录:CMakeLists.txt 在 hmi/ 下,`-S .` 指向仓库根 → configure 必失败
#   ② 测试同理,要在 hmi/tests
#   ③ 产物路径:实测 VS generator 的 OutDir 是 build\Debug\,不是 build\bin\Debug\,
#      而原来写的是 `if-no-files-found: warn` —— 路径错了也只是警告,CI 照样绿
name: build

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-2022
    # ★ 30 → 60 → 120。每一个数字都是被真实失败逼出来的,不是拍脑袋。
    #
    #   30:本机 Ninja 从零编【仅 66 个测试目标】就要 19.5 分钟,CI 还要
    #      多编一遍主程序、再跑一遍全部测试,而且 windows-2022 runner
    #      通常比本机慢 → 编译中途被 GitHub 掐掉。
    #   60:CI 第一次真跑(build 37895487099)失败于 Qt 模块缺失,
    #      修好后第二次真跑(37895849642)编到 55 分钟被 cancel。
    #      ★ 注意这里的教训:"超时"呈现出来的是一句 cancelled,
    #        没人会想到去翻日志看"到底编到第几个目标"。
    #        看到 cancelled 要先确认是【超时】还是【被取消】——
    #        这两者在 UI 上长得几乎一样。
    #   120:本地 Ninja 19.5 分钟 vs VS generator 55+ 分钟还没编完。
    #        VS generator 每个 target 都是独立 project,MSBuild 那边
    #        调度粒度比 Ninja 粗很多。真正的根治是让 CI 用 Ninja
    #        (本地同配置 19.5 分钟),或者把 ~25 个核心源文件抽成静态库
    #        —— 现在 67 个编译目标各自独立编译一遍这 25 个 .cpp。
    #        实测(build_ninja 目录):总 .obj 5161 个、3514.5 MB,其中
    #        AlarmRecorder.cpp.obj 有 67 份、核心源文件合计 721.5 MB,
    #        占编译输出的 20.5%。也就是说去重最多省五分之一,
    #        剩下 80% 花在这 67 个测试各自的 tst_*.cpp + moc + uic 上,
    #        那不是冗余,是真实工作量 —— 别指望 C 方案能一把解决超时。
    #        在那之前,先把超时抬到能跑完,拿到一次真实的绿灯基线。
    #
    #   ★ 2026-10-14 更正:上面那句"最多省五分之一"【低估了】。
    #     它大概只数了 src/ 下的源,漏掉了两个大头。重新按【字节】实测
    #     (build_ninja,5762 个 obj / 3834 MB):
    #       qcustomplot.cpp       72 份 × 13.5 MB = 973 MB = 25.4%
    #       mocs_compilation.cpp  72 份 ×  8.4 MB = 606 MB = 15.8%
    #       其余核心源(各 72 份)                    ≈ 45%
    #       各测试自己的 tst_*.cpp(各 1 份)         = 1.5%   ← 才是"真实工作量"
    #     ★ 所以去重方向是对的,而且比原估计有效得多:抽静态库能干掉
    #       3rdparty/qcustomplot + moc 这两块大头。
    #
    #   ★★ 同时记一条我今天犯的错,免得下一个人重蹈:
    #     我一度用"编译次数占比 98.5%"推出"时间能省 98.5%,
    #     CI 164 分钟能降到 3 分钟"—— 【那是拿次数当时间】,不成立。
    #     次数和耗时的权重完全不同(146 个编译单元里,moc 和 qcustomplot
    #     体积能顶几十个普通源文件)。要估时间,必须按【字节/实测时长】,
    #     不能按出现次数。
    #
    # ★★ 2026-10-14:抬到 120 之后【一次绿都没拿到】,而且现在是系统性失败。
    #   gh run list 实测,最近 7 次:
    #     5 次 cancelled,时长全是 2h0m2x —— 精确卡在超时线上;
    #     1 次 success,1h44m8s —— 只是【比这条线早了几分钟】;
    #     其余 in_progress。
    #   翻 38520431885 的日志("The job has exceeded the maximum
    #   execution time of 2h0m0s"),时间账实测如下:
    #
    #     14:08:04  runner 起来
    #     14:09:18  开始编主程序
    #     14:13:46  编完主程序        → 只花 4.5 分钟
    #     14:13:55  开始编 71 个测试目标
    #     16:08:30  被掐,死时正在编 EditorMainWindow.cpp
    #                —— 测试一个都还没开始跑    → 吃了 114.5 分钟
    #
    #   ★ 也就是说:整个 CI 的【95% 时间花在编测试目标上】,
    #     而超时线是 120 分钟。71 个目标已经用到 114.5 分钟,
    #     【没有余量了】—— 每加一个测试目标,就离被掐更近一步。
    #     那个 1h44m 的 success 不是"跑通了",是【挤进去了】。
    #
    #   本机同样从零编,Ninja 只要约 20 分钟,CI 上 VS generator 要 114+。
    #   慢 5 倍多。这就是上面"真正的根治是让 CI 用 Ninja"的实测依据 ——
    #   那条诊断一直是对的,只是【诊断完一直没执行】。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # ★ 2026-10-10:原来只有 qtserialbus,CI 第一次真跑就红在这一行。
          #   报错原文:Qt6SerialBus could not be found because dependency
          #   Qt6SerialPort could not be found。
          #   —— qtserialbus 依赖 qtserialport,而 install-qt-action 不会
          #   自动带上间接依赖。本地 D:\Qt 是全量安装,两个模块都在,
          #   所以本地永远发现不了这个问题。这就是"本地绿 ≠ CI 绿"。
          #   以后再加 Qt 模块,记得把【依赖链上的】都列进来。
          modules: 'qtserialbus qtserialport'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ★ 注意 install-qt-action 已经把 CMAKE_PREFIX_PATH 设成了环境变量,
      #   hmi/CMakeLists.txt 里那句硬编码的 set(CMAKE_PREFIX_PATH "D:/Qt/6.8.3/...")
      #   在这里【不会】顶掉它 —— 实测过:硬编码成不存在的路径,find_package 仍能
      #   从环境变量回落找到 Qt 6.8.3。所以本地那句硬编码是"丑但无害",没动它。
      # ★★ 2026-10-14:生成器从 "Visual Studio 17 2022" 换成 Ninja。
      #   依据是上面那段实测时间账:VS generator 编 71 个测试目标吃了
      #   114.5 分钟还没编完(超时的 95% 都花在这),本机 Ninja 只要约 20 分钟。
      #   MSBuild 的调度粒度比 Ninja 粗很多 —— VS generator 把每个 target
      #   当独立 project,依赖图被拆散,并行度上不去。
      #
      #   Ninja 是【单配置】生成器:构建类型在 configure 时定,不是 --config。
      #   所以下面两处的 --config Debug 全删,换成 -DCMAKE_BUILD_TYPE=Debug。
      #   ★ 原先我以为"ctest 那边的 -C Debug 留着就会让 ctest 找不到 exe"。
      #     实测否掉了:Ninja 下加不加 -C Debug 都能列出 71 个目标、
      #     都能真跑通(本机用 CI 的完整参数各跑了一遍)。
      #     所以那处 -C 也一并删了 —— 不是因为它有害,而是单配置生成器
      #     下它本来就没有意义,留着只会让人以为这里有讲究。
      #
      #   ★★★★ 但换生成器【没有解决问题】。run 38549902648(本配置首次实跑)
      #   又在 2h1m10s 被掐,同样是 "exceeded the maximum execution time"。
      #   实测时间账(逐事件算):
      #     18:30:51 → 18:33:26  编主程序      2 分 35 秒(VS 是 4.5 分,确实更快)
      #     18:33:30 → 20:30:20  编测试目标   117 分钟,编到 [4352/5904] = 74%
      #
      #   ★ 我上一轮那个结论是错的,错在【拿本机数据推 CI】:
      #     我看到"本机 Ninja 22.6 分钟 vs CI 上 VS 114.5 分钟",
      #     就认定差距是生成器造成的。换完发现只差 2 分钟 —— 生成器只占
      #     总时间的 2%。真正的原因是【CI 比本机慢 7 倍】:
      #       CI:  4372 个编译事件 / 7113 秒 = 0.61 个/秒
      #       本机: 5822 个目标  / 22.6 分钟 = 4.29 个/秒
      #     windows-2022 是 2 核 runner,本机多核 + 快 SSD —— 这是硬件差距,
      #     换生成器补不上。
      #     按 CI 速度推算编完需 160 分钟,+ 开销 ≈ 164 分钟,
      #     是 120 分钟线的 1.37 倍。
      #
      #   ★ 已排除的因素(别再往这两个方向使劲):
      #     · 并行度不是瓶颈:日志里 10 秒窗口有 4-8 个编译任务,
      #       --parallel 已经开满 runner 给的核数,再调高只会更慢。
      #     · 编译错误:不是。日志末尾是 "ninja: build stopped:
      #       interrupted by user",是被超时中断,不是编不过。
      #
      #   ★★★★ 2026-10-14(第二次改):核心源抽成静态库 —— 这才是根治。
      #     上面那条"换 Ninja 只占 2%"诊断没错,但它只解释了【为什么慢】,
      #     没解释【为什么那么慢】。真正的病根是:
      #       HMI_CORE_SOURCES 那 78 个源文件,原本被【每一个】测试目标
      #       各编一遍。72 个测试 × 78 个源 + AUTOMOC = 5904 个编译目标,
      #       其中约 85%(按字节算,依据见 hmi/tests/CMakeLists.txt)
      #       是【逐字节相同】的重复产物。
      #     现在 add_library(hmi_core STATIC ...) 编一次,全部测试链接它:
      #       编译目标  5822 → 1503   (-74%)
      #       本机全量   22.6 分钟 → 2.2 分钟 (-90%)   ← 干净重建实测
      #       ctest      71/71 全通过
      #
      #   ★★★★★ 2026-10-16 第一次拿到 CI 上的真实绿灯基线。
      #     上面那句"1503 个事件 ≈ 41 分钟"的【推算是错的,方向对、幅度差 5 倍】。
      #     run 38867389846 实测(仓库转公开后账单恢复,CI 才第一次真跑起来):
      #
      #       全程 07:28:05 → 07:34:32 = 6 分 27 秒
      #         拉代码          0.2 分
      #         装 Qt(缓存命中) 0.4 分
      #         配主程序        0.2 分
      #         编主程序        1.1 分  (96 个单元)
      #         配测试          0.03 分
      #         编测试          3.1 分  (373 个单元)   ← 上次死在这,74% 处被掐
      #         跑 72 个测试     1.3 分  (ctest 自报 77.13 秒,72/72 通过)
      #         传产物          0.05 分
      #
      #     真实编译单元【373 个】,不是推算的 1503 —— 我按字节占比推的,
      #     严重高估了。CI 速度实测 2.0 个/秒(不是从旧 run 反推的 0.61)，
      #     两个因子的误差互相抵消,所以【总时长】反而比推算好 7 倍。
      #
      #     ★ 排查过"是不是没真编"(这种好成绩第一反应就该怀疑):
      #       · "ninja: no work to do"      0 处      ← 确实全量重编
      #       · "restored from cache"       0 处      ← 不是缓存命中
      #       · Building CXX 317 + MOC/UIC 75 + Linking 75 = 468 条真实条目
      #       · hmi_core 的 78 个源【只编 1 遍】(81 条含 moc)—— 去重是真的生效了
      #       · User.cpp 出现 5 次但分散在【不同 target】
      #         (主程序 / hmi_core / 几个独立 add_executable 的测试),
      #         不是同一个 target 里重复编
      #
      #     ★ 结论:超时问题【已根治】。6.5 分钟 vs 120 分钟线 = 余量 94.6%。
      #       离上次被掐已经过去 2 天,而这 2 天里代码还在继续加测试
      #       (71 → 72 个),余量绰绰有余。
      #
      #     ★ 这也是本仓库【第一次】 CI 拿到真绿灯 —— 之前 7 次里
      #       5 次被掐、2 次因为私库额度用光而 3 秒拒开工。
      #       首次绿灯的前提是 fe94524 那个提交把仓库转成了公开
      #       (公开仓库 Actions 免费)。转公开前账单那条路走不通。
      - name: Configure (主程序)
        run: cmake -S hmi -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Configure (tests)
        run: cmake -S hmi/tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        run: cmake --build build-tests --parallel

      - name: Run tests
        working-directory: build-tests
        # ★ QT_QPA_PLATFORM 必须显式设。
        #   66 个 ctest 目标里有 38 个在 initTestCase 里自己
        #   qputenv("offscreen"),但另外 28 个没有 —— 它们靠的是
        #   【调用者】已经设好了。
        #   本地靠 build_tests.ps1:56 设,CI 上没有这个脚本,不设就会在
        #   无显示器的 runner 上弹真窗口甚至直接崩。
        #
        #   ★ 这里有三个不一样的数,别互相套用、也别当成 bug 去"修":
        #       磁盘 tst_*.cpp     = 67   (Get-ChildItem)
        #       编译目标(67 个 exe)= 67   (ninja -t targets all)
        #                              66 个 add_hmi_test() + 1 个直接
        #                              add_executable,见
        #                              hmi/tests/CMakeLists.txt:165
        #       ctest 目标         = 66   (ctest -N)
        #     差的那一个是有意为之:tst_ProtocolComboShot 只编译、
        #     不注册测试 —— 它靠真实 QTipLabel 显示取证,要多链 UiTools
        #     和两个路径宏,判定线不稳,进 ctest 会变成间歇性失败。
        #     但它【确实会被编译】,所以它照样占一整份 HMI_CORE_SOURCES。
        env:
          QT_QPA_PLATFORM: offscreen
        # ★ 删掉了原来的 -C Debug。Ninja 是单配置生成器,没有"配置"可选。
        #   实测:加不加它都能列出 71 个目标、都能跑通(见上面注释)。
        run: ctest --output-on-failure

      - name: Upload hmi.exe
        uses: actions/upload-artifact@v4
        with:
          name: hmi-windows-debug
          # ★ 路径由实测得来:VS generator 生成的是 build\Debug\hmi.exe,
          #   换 Ninja 后是 build\hmi.exe(单配置,没有 Debug 子目录)。
          #   ★ 这个路径是【本机实测】出来的:用 CI 的完整参数
          #     (cmake -S hmi -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug)
          #     编一遍,build\hmi.exe 存在、build\Debug\hmi.exe 不存在。
          #     产物路径必须跟着生成器一起改 —— 换了 Ninja 却留着
          #     build/Debug/,配下面 if-no-files-found: error 应该是会红的
          #     (这一条【未实测】,upload 步骤本地跑不了;但既然有 error 兜底,
          #      路径错了 CI 一定会报,不会是又一次"悄悄传了个空")。
          #   原来写的 build/bin/Debug/hmi.exe 配合 `warn` = 产物从来没上传过,
          #   而且 CI 不会因此变红 —— 又一个"看起来在跑,其实没跑"。
          path: build/hmi.exe
          # ★ 从 warn 改成 error。
          #   产物传不上去必须让 CI 红,否则这个 step 和没有一样,
          #   而"传不上去"正是下游拿到过期二进制的源头。
          if-no-files-found: error
